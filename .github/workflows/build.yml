name: Build Lumina Studio Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Capacitor, Custom Studio Icon & Build APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Lumina Studio Pro" "com.dhaneshwar.luminastudio" --web-dir=www
          npx cap add android
          python3 -c '
          import os, zlib, struct
          def make_png(size):
              raw = bytearray()
              c = size / 2.0
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      d = ((x - c)**2 + (y - c)**2)**0.5
                      if d < size * 0.22:
                          raw.extend([14, 165, 233, 255])
                      elif d < size * 0.36:
                          raw.extend([139, 92, 246, 255])
                      else:
                          raw.extend([12, 12, 18, 255])
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw))) + chunk(b"IEND", b"")
          for folder, sz in [("mipmap-mdpi",48),("mipmap-hdpi",72),("mipmap-xhdpi",96),("mipmap-xxhdpi",144),("mipmap-xxxhdpi",192)]:
              p = f"android/app/src/main/res/{folder}"
              os.makedirs(p, exist_ok=True)
              png = make_png(sz)
              open(f"{p}/ic_launcher.png","wb").write(png)
              open(f"{p}/ic_launcher_round.png","wb").write(png)
              open(f"{p}/ic_launcher_foreground.png","wb").write(png)
          '
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Studio-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
